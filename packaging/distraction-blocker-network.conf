# distraction-blocker-network-owned-v1
# Installed only after explicit network-risk acceptance.
[Unit]
Requires=distraction-blocker-network-restore.service
After=distraction-blocker-network-restore.service

[Service]
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_DAC_READ_SEARCH CAP_SYS_RESOURCE CAP_CHOWN CAP_NET_ADMIN
AmbientCapabilities=CAP_SYS_ADMIN CAP_DAC_READ_SEARCH CAP_SYS_RESOURCE CAP_CHOWN CAP_NET_ADMIN
